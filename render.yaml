# Render.com deployment blueprint
# Production security defaults are enforced by the backend.
# Secrets must be configured in Render's environment/secret settings.

services:
  - type: web
    name: agrisaathi-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mlbackend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENFORCE_JWT_AUTH
        value: "true"
      - key: DEV_MODE
        value: "false"
      - key: DEV_ALLOW_INSECURE_AUTH
        value: "false"
      - key: OLLAMA_BASE_URL
        value: ""
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.1-8b-instant"
      - key: RAG_CHUNK_SIZE
        value: "350"
      - key: RAG_TOP_K
        value: "3"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
