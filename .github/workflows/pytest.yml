name: ML Provenance Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest fastapi httpx scikit-learn pandas pydantic joblib cryptography
        
    - name: Run ML Provenance Tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest mlbackend/test_ml_provenance.py -v
        pytest mlbackend/test_vision_provenance.py -v
